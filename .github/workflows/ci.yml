name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Schema / migration drift
        run: npx drizzle-kit check

      - name: Server action authorisation audit
        run: python3 scripts/audit-authz.py

      # The build must succeed with no database available. The driver is
      # created lazily and migrations run at server start, so a compile never
      # touches a database.
      - name: Production build
        env:
          # The origin guard test below needs a configured extra origin, and
          # the allowed origins are compiled into the build.
          SERVER_ACTION_ALLOWED_ORIGINS: 192.168.1.42
        run: npm run build

      - name: Route smoke test
        env:
          TEST_SESSION_ENABLED: "true"
          TEST_SESSION_TOKEN: ci-smoke-token
        run: |
          npm run start &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs

      # The public auth screens post to a route handler, so signing in must
      # work with JavaScript disabled. This asserts the whole native flow.
      - name: Native auth form test (no JavaScript)
        env:
          TEST_SESSION_ENABLED: "true"
          TEST_SESSION_TOKEN: ci-smoke-token
        run: node scripts/auth-form.mjs

      # Every demonstration account must be able to sign in, and the failure
      # message has to be the real one, not a generic refusal.
      - name: Sign-in check for every role
        env:
          TEST_SESSION_ENABLED: "true"
          TEST_SESSION_TOKEN: ci-smoke-token
        run: node scripts/check-logins.mjs

      # Everything inside the app uses React server actions. This replays the
      # browser's request shape and asserts the action runs and is guarded.
      - name: Server action transport test
        env:
          TEST_SESSION_ENABLED: "true"
          TEST_SESSION_TOKEN: ci-smoke-token
        run: node scripts/action-invoke.mjs

      # The end-to-end demonstration: signs in through the real login form,
      # walks every screen, and exercises saved views, pagination, PDF
      # export, the routing solver, the job runner, live tracking,
      # multicurrency and the observability stack.
      - name: Live demo
        env:
          TEST_SESSION_ENABLED: "true"
          TEST_SESSION_TOKEN: ci-smoke-token
        run: node scripts/demo.mjs

      # The Server Action CSRF guard. A browser whose origin matches the host
      # is allowed; a rewritten host is allowed only when the public origin is
      # configured. The build below is made with the extra origin in place.
      - name: Origin guard test
        env:
          TEST_SESSION_ENABLED: "true"
          TEST_SESSION_TOKEN: ci-smoke-token
          SERVER_ACTION_ALLOWED_ORIGINS: 192.168.1.42
        run: node scripts/origin-check.mjs

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: staffride:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
